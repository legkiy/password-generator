name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.{0}', github.run_number) }}
      PRERELEASE: ${{ github.ref_type != 'tag' }}

    steps:
      - name: Получить код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Установить Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod

      - name: Проверить код
        run: |
          go test ./...
          go vet ./...

      - name: Собрать приложения
        run: |
          mkdir -p release/macos-arm64 release/macos-amd64 release/windows-amd64 release/linux-amd64

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o release/macos-arm64/pass-generator .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release/macos-amd64/pass-generator .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release/windows-amd64/pass-generator.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release/linux-amd64/pass-generator .

          cat > release/macos-arm64/start.command <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          exec ./pass-generator
          EOF

          cp release/macos-arm64/start.command release/macos-amd64/start.command
          chmod +x release/macos-arm64/start.command release/macos-amd64/start.command

          printf '%s\r\n' '@echo off' '"%~dp0pass-generator.exe"' 'pause' > release/windows-amd64/start.bat

          tar -C release/macos-arm64 -czf "release/pass-generator_${VERSION}_macos-arm64.tar.gz" .
          tar -C release/macos-amd64 -czf "release/pass-generator_${VERSION}_macos-amd64.tar.gz" .
          tar -C release/linux-amd64 -czf "release/pass-generator_${VERSION}_linux-amd64.tar.gz" .
          zip -j "release/pass-generator_${VERSION}_windows-amd64.zip" release/windows-amd64/*

          cat > release/release-notes.md <<'EOF'
          ## Запуск

          1. Скачайте архив для своей операционной системы и распакуйте его.
          2. **macOS Apple Silicon (M1/M2/M3 и новее):** откройте `start.command` из архива `macos-arm64`.
          3. **macOS Intel:** откройте `start.command` из архива `macos-amd64`.
          4. **Windows:** откройте `start.bat` из архива `windows-amd64`.
          5. **Linux:** в терминале выполните `chmod +x pass-generator` и затем `./pass-generator`.

> На macOS появится предупреждение о непроверенном разработчике: приложение ещё не подписано сертификатом Apple. Нажмите правой кнопкой на `pass-generator`, выберите **Открыть** и подтвердите запуск. После этого запускайте `start.command`.

Пароли не сохраняются в истории приложения. Сохраняются только длина и исключённые символы.
          EOF

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/*.tar.gz release/*.zip --clobber
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$VERSION" release/*.tar.gz release/*.zip \
              --target "$GITHUB_SHA" \
              --title "Password Generator $VERSION" \
              --notes-file release/release-notes.md \
              --prerelease
          else
            gh release create "$VERSION" release/*.tar.gz release/*.zip \
              --target "$GITHUB_SHA" \
              --title "Password Generator $VERSION" \
              --notes-file release/release-notes.md
          fi
